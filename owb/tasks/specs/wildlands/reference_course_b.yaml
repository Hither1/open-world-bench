# Wildlands reference course B (compact demonstration course; docs/wildlands-reference-demos.md).
# Mirrors the course built by setup `wildlands.reference_course`
# (owb/tasks/wildlands/setup.py); tests/test_reference_specs.py checks it against that
# course and the recorded trace.
# Completion conditions here are held durations and live-world states (stable feed for
# 5 s, plume <= 45 C, two seconds of released motion, ...), which the Predicate language
# cannot express; the mechanism modules (owb/tasks/wildlands/mechanisms/) evaluate them and
# the course ledger emits `milestone_complete`, which these milestones fire on
# (owb.tasks.wildlands.course.evaluator_events puts the milestone id in `entity`).
# `requires` is the course's assessment DAG (Milestone.prereqs).
# `stage`/`role` are memory-role annotations taken from docs/wildlands-long-horizon-tasks.md;
# they do not affect scoring. Session split points (after B08, B12 or B19) belong to the agent harness.
# setup_params: `course` selects the site table; the setup RNG is default_rng(seed + 8191).
id: wildlands.reference_course_b
version: 1
sim: wildlands
title: 'Wildlands reference course B: The Valley Before the Storm (compact)'
instruction: Restore the valley floodworks, divert the rising water away from the designated refuge, and
  reopen its evacuation road.
budget:
  steps: 14000
setup: wildlands.reference_course
setup_params:
  course: b
