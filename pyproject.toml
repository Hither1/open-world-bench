[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-world-bench"
version = "0.1.0"
description = "Open-world exploration and survival environments for long-horizon embodied agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
agent = ["openai>=2.1", "Pillow>=9"]
gl = ["moderngl>=5.8"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4", "Pillow>=9"]
fast = ["numba>=0.58"]
dev = ["pytest>=7"]

[project.scripts]
owb = "owb.cli.main:main"

[tool.setuptools.packages.find]
include = ["open_world_bench*", "owb*"]

[tool.setuptools.package-data]
"owb.tasks" = ["specs/**/*.yaml", "specs/**/*.yml", "specs/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
