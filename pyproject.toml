[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-world-bench"
version = "0.1.0"
description = "Open-world exploration and survival environments for long-horizon embodied agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
gl = ["moderngl>=5.8"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4"]
fast = ["numba>=0.58"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["open_world_bench*", "owb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
