# GPT-6-Astra through the Responses API (profile api-stateless, store=False).
# Needs OPENAI_API_KEY and pip install -e ".[agent]"; up to 12 paid requests.
run: {name: openai-wildlands}
env:
  sim: wildlands
  image_size: [320, 240]
task: {seeds: [7]}
agent:
  policy: llm
  harness:
    kind: openai_api
    model: gpt-6-astra
    effort: low
    max_output_tokens: 2048
    image_detail: auto
    timeout: 60
    profile: api-stateless
  history_steps: 6
budget: {max_steps: 12, max_model_calls: 12}
record: {video: null}
